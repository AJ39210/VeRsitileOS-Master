
# VeRsitileOS Limine Theme

# Boot menu
timeout: 5
default_entry: 1

# Graphics
graphics: yes
interface_resolution: 1920x1080

# Branding
interface_branding: VeRsitileOS
interface_branding_colour: FF3333

# Wallpaper
wallpaper: boot():/boot/limine/versitile-wallpaper.png
wallpaper_style: stretched
backdrop: 080808

# Terminal appearance
term_background: 80000000
term_foreground: FFFFFF
term_margin: 64
term_margin_gradient: 8

# VeRsitileOS kernel
/VeRsitileOS

protocol: limine
path: boot():/boot/kernel.elf
