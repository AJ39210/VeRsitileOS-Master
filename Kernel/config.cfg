# Kernel build configuration. This file is included by GNU make.

CC = gcc
LD = ld
NASM = nasm

ROOT = ..
BUILD = build
PORT_ROOT = $(ROOT)/port
LIBC_ROOT = $(PORT_ROOT)/libc
LIBX_ROOT = $(PORT_ROOT)/libx
NANO_ROOT = $(PORT_ROOT)/nano
VCC_ROOT = $(PORT_ROOT)/vcc
LIBC_INCLUDE = $(LIBC_ROOT)/include
KERNEL_VERSION = $(shell sed -n 's/^kernel_version[[:space:]]*=[[:space:]]*//p' Version.cfg)

ISO_ROOT = $(ROOT)/iso_root
ISO = $(ROOT)/VeRsitileOS.iso
LIMINE = $(ROOT)/limine
SYSTEM_LIBC = $(ROOT)/system/lib/libc.so
SYSTEM_BIN = $(ROOT)/system/bin
USER_TERMINAL = $(SYSTEM_BIN)/terminal
USER_KILO = $(SYSTEM_BIN)/kilo
USER_VCC = $(SYSTEM_BIN)/vcc
USER_DOOM = $(SYSTEM_BIN)/doom
USER_SETUP = $(SYSTEM_BIN)/setup
USER_SYSTEMD = $(ROOT)/system/init/systemd
USER_COMMANDS = $(addprefix $(SYSTEM_BIN)/,ls cd mkdir rmdir cat ping neofetch ifconfig resolve lsblk install)
USER_ELF = $(BUILD)/user/elf_test
USER_ELF_SOURCE = User/elf_test.c
USER_TERMINAL_SOURCE = $(ROOT)/system/src/terminal.c
USER_TERMINAL_HEADERS = $(LIBC_INCLUDE)/os/gui.h
USER_KILO_SOURCE = $(PORT_ROOT)/kilo/kilo.c
USER_KILO_HEADERS = $(LIBC_INCLUDE)/os/gui.h
USER_VCC_SOURCE = $(VCC_ROOT)/vcc.c
USER_VCC_HEADERS = $(LIBC_INCLUDE)/stdio.h \
	$(LIBC_INCLUDE)/stdlib.h $(LIBC_INCLUDE)/string.h
DOOM_ROOT = $(PORT_ROOT)/DOOM-master
DOOM_ENGINE = $(DOOM_ROOT)/linuxdoom-1.10
DOOM_DATA_DIR = $(ISO_ROOT)/usr/share/doom
DOOM_IWADS = $(DOOM_ROOT)/freedoom1.wad $(DOOM_ROOT)/freedoom2.wad
DOOM_IWAD_LICENSE = $(ROOT)/docs/doom/FREEDOOM-LICENSE.txt
DOOM_SOURCE_FILES = \
	doomdef.c doomstat.c dstrings.c tables.c f_finale.c f_wipe.c \
	d_main.c d_net.c d_items.c g_game.c m_menu.c m_misc.c m_argv.c \
	m_bbox.c m_fixed.c m_swap.c m_cheat.c m_random.c am_map.c \
	p_ceilng.c p_doors.c p_enemy.c p_floor.c p_inter.c p_lights.c \
	p_map.c p_maputl.c p_plats.c p_pspr.c p_setup.c p_sight.c \
	p_spec.c p_switch.c p_mobj.c p_telept.c p_tick.c p_saveg.c \
	p_user.c r_bsp.c r_data.c r_draw.c r_main.c r_plane.c r_segs.c \
	r_sky.c r_things.c w_wad.c wi_stuff.c v_video.c st_lib.c \
	st_stuff.c hu_stuff.c hu_lib.c s_sound.c z_zone.c info.c sounds.c
DOOM_SOURCES = $(addprefix $(DOOM_ENGINE)/,$(DOOM_SOURCE_FILES))
DOOM_PLATFORM_SOURCES = \
	$(DOOM_ROOT)/versitile/i_versitile_main.c \
	$(DOOM_ROOT)/versitile/i_versitile_compat.c \
	$(DOOM_ROOT)/versitile/i_versitile_system.c \
	$(DOOM_ROOT)/versitile/i_versitile_sound.c \
	$(DOOM_ROOT)/versitile/i_versitile_video.c
DOOM_HEADERS = $(wildcard $(DOOM_ENGINE)/*.h) \
	$(wildcard $(DOOM_ROOT)/versitile/*.h) \
	$(wildcard $(DOOM_ROOT)/versitile/include/*.h) \
	$(wildcard $(DOOM_ROOT)/versitile/include/sys/*.h)
DOOM_CFLAGS = $(USER_CFLAGS) -DNORMALUNIX -DVERSITILEOS \
	-I $(DOOM_ENGINE) -I $(DOOM_ROOT)/versitile/include \
	-include $(DOOM_ROOT)/versitile/doom_compat.h
USER_SYSTEMD_SOURCE = $(ROOT)/system/src/systemd/systemd.c
USER_SYSTEMD_HEADERS = $(LIBC_INCLUDE)/os/gui.h \
	$(LIBC_INCLUDE)/unistd.h $(LIBC_INCLUDE)/stdio.h \
	$(LIBC_INCLUDE)/string.h $(LIBC_INCLUDE)/stdlib.h \
	$(LIBC_INCLUDE)/setjmp.h
USER_COMMAND_SOURCE = $(ROOT)/system/src/command.c
USER_COMMAND_HEADERS = $(LIBC_INCLUDE)/os/gui.h
SYSTEM2_ROOT = $(ROOT)/system2
SYSTEM2_BIN = $(SYSTEM2_ROOT)/bin
SYSTEM2_INIT = $(SYSTEM2_ROOT)/init/systemd
SYSTEM2_TERMINAL = $(SYSTEM2_BIN)/terminal
SYSTEM2_COMMAND_SOURCE = $(SYSTEM2_ROOT)/src/command.c
SYSTEM2_COMMANDS = $(addprefix $(SYSTEM2_BIN)/,ls cd mkdir rmdir cat ping neofetch ifconfig resolve lsblk install)
SYSTEM2_KILO = $(SYSTEM2_BIN)/kilo
SYSTEM2_VCC = $(SYSTEM2_BIN)/vcc
SYSTEM2_DOOM = $(SYSTEM2_BIN)/doom
SYSTEM2_SETUP = $(SYSTEM2_BIN)/setup
ROOTFS_ARCHIVE = $(ROOT)/system/install/rootfs.tar
USER_SETUP_SOURCE = $(SYSTEM2_ROOT)/src/setup/setup.c
NASM_FORMAT = elf64
KERNEL_LINKER_SCRIPT = linker.ld

CFLAGS = -std=gnu11 \
	-ffreestanding \
	-fno-stack-protector \
	-fno-pic \
	-fno-pie \
	-fno-omit-frame-pointer \
	-m64 \
	-mno-red-zone \
	-mcmodel=kernel \
	-mgeneral-regs-only \
	-mno-sse \
	-mno-sse2 \
	-mno-mmx \
	-msoft-float \
	-fno-tree-vectorize \
	-MMD \
	-MP \
	-Wall \
	-Wextra \
	-O2 \
	-DKERNEL_VERSION='"$(KERNEL_VERSION)"' \
	-I Include \
	-I $(LIBC_INCLUDE)

LDFLAGS = -nostdlib \
	-static \
	-z max-page-size=0x1000 \
	-T $(KERNEL_LINKER_SCRIPT)

KERNEL_C_SOURCES = \
	Kernel/kmain.c \
	Kernel/test.c \
	Kernel/block.c \
	Kernel/process/task.c \
	Kernel/process/elf_loader.c \
	Kernel/syscalls/syscall.c \
	Kernel/modules/module.c \
	drm/code/drm.c \
	fs/vfs/vfs.c \
	fs/devfs/devfs.c \
	fs/procfs/procfs.c \
	fs/sysfs/sysfs.c \
	fs/mbr.c \
	fs/installer.c \
	fs/ext2/ext2.c \
	fs/fat32/fat32.c \
	fs/ISO9660/iso9660.c \
	Block/ata_pio.c \
	Block/ATAPI/atapi.c \
	Kernel/gdt/gdt.c \
	Kernel/idt/idt.c \
	Kernel/irq/irq.c \
	Kernel/irq/pic.c \
	Kernel/isr/isr.c \
	Kernel/apic/apic.c \
	Kernel/acpi/acpi.c \
	Kernel/timer/pit.c \
	Kernel/timer/rtc.c \
	Kernel/mm/pmm.c \
	Kernel/mm/vmm.c \
	Kernel/mm/paging.c \
	Kernel/mm/mm.c \
	Kernel/mm/sync/spinlock.c \
	Kernel/mm/region/region.c \
	Kernel/mm/heap/heap.c

KERNEL_RUST_SOURCES = \
	rust/src/panic/panic.rs

DRIVER_SOURCES = \
	Drivers/GOP/gop.c \
	Drivers/PCI/pci.c \
	Drivers/Usb/xhci.c \
	Drivers/Virtio/virtio_pci.c \
	Drivers/Virtio/virtio_legacy.c \
	Drivers/Virtio/virtio_blk.c \
	Drivers/Virtio/virtio_input.c \
	Drivers/HID/hid.c \
	Drivers/WiFi/intel8265.c \
	Drivers/WiFi/ar5007eg.c \
	Drivers/vesa/vesa.c \
	Drivers/Keyboard/keyboard.c \
	Drivers/Keyboard/ps2.c \
	Drivers/Mouse/mouse.c \
	Drivers/Ethernet/network.c \
	Drivers/serial/serial.c

# All drivers start enabled. The configuration app can switch each entry off.
DRIVER_ENABLE_Drivers/GOP/gop.c = y
DRIVER_ENABLE_Drivers/PCI/pci.c = y
DRIVER_ENABLE_Drivers/Usb/xhci.c = y
DRIVER_ENABLE_Drivers/Virtio/virtio_pci.c = y
DRIVER_ENABLE_Drivers/Virtio/virtio_legacy.c = y
DRIVER_ENABLE_Drivers/Virtio/virtio_blk.c = y
DRIVER_ENABLE_Drivers/Virtio/virtio_input.c = y
DRIVER_ENABLE_Drivers/HID/hid.c = y
DRIVER_ENABLE_Drivers/WiFi/intel8265.c = y
DRIVER_ENABLE_Drivers/WiFi/ar5007eg.c = y
DRIVER_ENABLE_Drivers/vesa/vesa.c = y
DRIVER_ENABLE_Drivers/Keyboard/keyboard.c = y
DRIVER_ENABLE_Drivers/Keyboard/ps2.c = y
DRIVER_ENABLE_Drivers/Mouse/mouse.c = y
DRIVER_ENABLE_Drivers/Ethernet/network.c = y
DRIVER_ENABLE_Drivers/serial/serial.c = y

ASM_SOURCES = \
	Kernel/gdt/gdt.asm \
	Kernel/idt/idt.asm \
	Kernel/irq/irq.asm \
	Kernel/isr/isr.asm \
	Kernel/apic/apic.asm \
	Kernel/syscalls/syscall.asm

LIBC_SOURCES = \
	$(LIBC_ROOT)/src/syscall.c \
	$(LIBC_ROOT)/src/socket.c \
	$(LIBC_ROOT)/src/mman.c \
	$(LIBC_ROOT)/src/unistd.c \
	$(LIBC_ROOT)/src/stdlib.c \
	$(LIBC_ROOT)/src/string.c \
	$(LIBC_ROOT)/src/strings.c \
	$(LIBC_ROOT)/src/ctype.c \
	$(LIBC_ROOT)/src/stdio.c \
	$(LIBC_ROOT)/src/time.c
LIBC_OBJECTS = $(patsubst $(LIBC_ROOT)/src/%.c,$(BUILD)/libc/%.o,$(LIBC_SOURCES))
LIBC_ASM_OBJECTS = $(BUILD)/libc/setjmp.o
LIBC_HEADERS = $(wildcard $(LIBC_INCLUDE)/*.h $(LIBC_INCLUDE)/sys/*.h) \
	$(wildcard $(LIBC_ROOT)/src/*.h)
LIBC_SHARED = $(BUILD)/libc/libc.so
USER_CRT0 = $(BUILD)/libc/crt0.o

COMMAND_DEFINE_ls = -DAPP_LS
COMMAND_DEFINE_cd = -DAPP_CD
COMMAND_DEFINE_mkdir = -DAPP_MKDIR
COMMAND_DEFINE_rmdir = -DAPP_RMDIR
COMMAND_DEFINE_cat = -DAPP_CAT
COMMAND_DEFINE_ping = -DAPP_PING
COMMAND_DEFINE_neofetch = -DAPP_NEOFETCH
COMMAND_DEFINE_ifconfig = -DAPP_IFCONFIG
COMMAND_DEFINE_resolve = -DAPP_RESOLVE
COMMAND_DEFINE_lsblk = -DAPP_LSBLK
COMMAND_DEFINE_install = -DAPP_INSTALL

COMMAND_CFLAGS = -std=gnu11 \
	-ffreestanding -fPIE -fno-builtin -fno-stack-protector \
	-fno-asynchronous-unwind-tables -fno-unwind-tables \
	-m64 -mno-red-zone -mgeneral-regs-only -mno-sse -mno-sse2 \
	-mno-mmx -msoft-float -Wall -Wextra -O2 -nostdlib -nodefaultlibs \
	-pie -Wl,--no-dynamic-linker -Wl,--hash-style=sysv -Wl,-z,now \
	-Wl,-e,_start -Wl,--build-id=none -Wl,-z,max-page-size=0x1000 \
	-I $(LIBC_INCLUDE) -I $(ROOT)/system/include

USER_CFLAGS = -std=gnu11 \
	-ffreestanding -fPIE -fno-builtin -fno-stack-protector \
	-fno-asynchronous-unwind-tables -fno-unwind-tables \
	-m64 -mno-red-zone -mgeneral-regs-only -mno-sse -mno-sse2 \
	-mno-mmx -msoft-float -Wall -Wextra -O2 -nostdlib -nodefaultlibs \
	-pie -Wl,--no-dynamic-linker -Wl,--hash-style=sysv -Wl,-z,now \
	-Wl,-e,_start -Wl,--build-id=none -Wl,-z,max-page-size=0x1000 \
	-I $(LIBC_INCLUDE) -I $(ROOT)/system/include
USER_ELF_CFLAGS = -I $(ROOT)/system/include/freetype2
USER_TERMINAL_CFLAGS =
USER_ELF_LIBS = -lfreetype -lpng -lz -lc
USER_TERMINAL_LIBS = -lc
USER_SYSTEMD_LIBS = -lc
USER_COMMAND_LIBS = -lc

LIBC_CFLAGS = -std=gnu11 \
	-ffreestanding -fPIC -fno-stack-protector -fno-builtin \
	-fno-asynchronous-unwind-tables -fno-unwind-tables \
	-m64 -mno-red-zone -mgeneral-regs-only -mno-sse -mno-sse2 \
	-mno-mmx -msoft-float -Wall -Wextra -O2 -I $(LIBC_INCLUDE)
LIBC_LDFLAGS = -shared -nostdlib -nodefaultlibs -fPIC \
	-Wl,-soname,libc.so -Wl,--hash-style=sysv -Wl,-z,now \
	-Wl,-z,max-page-size=0x1000

GRAPHICS_SOURCE_DIRS = $(LIBC_ROOT)/zlib-1.3.2 \
	$(LIBC_ROOT)/libpng-1.6.59 \
	$(LIBC_ROOT)/freetype-master \
	$(LIBC_INCLUDE)
GRAPHICS_BUILD_INPUTS = $(shell find $(GRAPHICS_SOURCE_DIRS) -type f)
GRAPHICS_LIB_OUTPUTS = $(ROOT)/system/lib/libz.a \
	$(ROOT)/system/lib/libpng.a \
	$(ROOT)/system/lib/libfreetype.a
GRAPHICS_STAMP = $(BUILD)/graphics-libs.stamp
