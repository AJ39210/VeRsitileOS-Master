[SYSTEMD]
Config=/etc/system/systemd/main.cfg
Version=/etc/system/systemd/version
Write_Logs_At=/var/systemd/systemd.log
Log_Level=4                                      #log level: 0=none, 1=show errors only, 2=warning only, 3=info only, 4=display everything
CPUAffinity=1                                    #Specifies default CPU core bindings for systemd and its child processes duhh
RebootWatchdog=y                                 # y -enabled n -disabled
RebootWatchdogSec=10
Modules=/lib/modules/5.0.7/
Terminal=/bin/terminal
OSName=/etc/system/os_name
Host=/etc/system/host
Desktop=/etc/system/desktop

[OTHER]
/fonts/

[SYSTEM]
/bin/
/bin/terminal
/dev/
/proc/
/sys/
/usr/
/firmware/
/lib/
/lib/modules/5.0.7/

[INCLUDE]
/include/

[BOOT]
/boot/
/EFI/
/EFI/BOOT/
/boot/limine/